name: Release Hystersis

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: xai-hystersis-pager

jobs:
  # ─── Build matrix (only on tags) ───────────────────────────────────────
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: hystersis-macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: hystersis-macos-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: hystersis-linux-x64
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            artifact: hystersis-linux-arm64
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross-compiler (Linux ARM64 only)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-
      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          VERSION_WITH_COMMIT: ${{ github.ref_name }}-${{ github.sha }}
        run: |
          cargo build --release --package xai-hystersis-pager-bin --target ${{ matrix.target }}
      - name: Rename binary
        run: cp target/${{ matrix.target }}/release/${{ env.BINARY_NAME }} ${{ matrix.artifact }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 1

  # ─── Create GitHub Release (only on tags) ───────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
      - name: Flatten dist dir
        run: find dist/ -type f -exec mv {} dist/ \; 2>/dev/null || true
      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum hystersis-macos-arm64 hystersis-macos-x64 hystersis-linux-x64 hystersis-linux-arm64 > checksums.txt
          cat checksums.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Hystersis ${{ github.ref_name }}
          body: |
            ## Hystersis ${{ github.ref_name }}
            The autonomous AI coding assistant — powered by OpenRouter.
            ### Install
            ```bash
            curl -fsSL https://code.hystersis.com/install.sh | sh
            ```
            ### Manual Download
            | Platform | Binary |
            |----------|--------|
            | macOS Apple Silicon | `hystersis-macos-arm64` |
            | macOS Intel         | `hystersis-macos-x64`   |
            | Linux x64           | `hystersis-linux-x64`   |
            | Linux ARM64         | `hystersis-linux-arm64` |
            ### Checksums (SHA256)
            See `checksums.txt` attached below.
          files: |
            dist/hystersis-macos-arm64
            dist/hystersis-macos-x64
            dist/hystersis-linux-x64
            dist/hystersis-linux-arm64
            dist/checksums.txt
          draft: false
          prerelease: false

  # ─── Deploy landing page + install.sh to Cloudflare (on every push to main + tags) ───
  deploy:
    name: Deploy code.hystersis.com
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build landing (ASCII B/W)
        working-directory: landing
        run: |
          npm ci
          npm run build
          # Ensure install.sh is executable and has correct repo (Himan-D/hystersis)
          chmod +x public/install.sh
          cp public/install.sh dist/install.sh
          # Verify og tags for WhatsApp
          grep -q 'og:image:width' dist/index.html || (echo "Missing WhatsApp OG tags" && exit 1)
          grep -q 'og:image:height' dist/index.html || (echo "Missing WhatsApp OG tags" && exit 1)
          ls -lh dist/og.png
      - name: Deploy to Cloudflare Pages (via Wrangler - supports OAuth)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          wranglerVersion: "4.27.0"
          command: pages deploy landing/dist --project-name=code
      - name: Deploy Worker (assets) for code.hystersis.com
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: "4.27.0"
          command: deploy --config landing/wrangler.toml
