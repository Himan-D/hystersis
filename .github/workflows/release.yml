name: Release Hystersis

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: hystersis

jobs:
  # ─── Build + upload binaries (only on tags) ─────────────────────────────
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: hystersis-macos-arm64
          - os: macos-14
            target: x86_64-apple-darwin
            artifact: hystersis-macos-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: hystersis-linux-x64
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            artifact: hystersis-linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: hystersis-windows-x64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: hystersis-windows-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}-${{ matrix.os }}
          cache-all-crates: "true"

      - name: Install cross-compiler (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install protoc
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == macos* ]]; then
            brew install protobuf
          elif [[ "${{ matrix.os }}" == windows* ]]; then
            choco install protoc
          else
            sudo apt-get update -q
            sudo apt-get install -y protobuf-compiler
          fi

      - name: Install dotslash
        if: matrix.os != 'windows-latest'
        uses: taiki-e/install-action@v2
        with:
          tool: dotslash@0.1.20

      - name: Build release binary
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release \
            --package hystersis-pager-bin \
            --target ${{ matrix.target }}

      - name: Rename + strip binary
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == windows* ]]; then
            cp target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}.exe ${{ matrix.artifact }}.exe
          else
            cp target/${{ matrix.target }}/release/${{ env.BINARY_NAME }} ${{ matrix.artifact }}
            # Strip debug symbols on Linux to reduce size
            if [[ "${{ matrix.os }}" == ubuntu* && "${{ matrix.target }}" == x86_64* ]]; then
              strip ${{ matrix.artifact }} || true
            fi
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}${{ matrix.os == 'windows-latest' && '.exe' || '' }}
          retention-days: 1

  # ─── Publish GitHub Release with binaries (only on tags) ────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: dist
        run: |
          sha256sum hystersis-macos-arm64 hystersis-macos-x64 \
                    hystersis-linux-x64 hystersis-linux-arm64 \
                    hystersis-windows-x64.exe hystersis-windows-arm64.exe > checksums.txt
          cat checksums.txt

      - name: Publish release with binaries
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Hystersis ${{ github.ref_name }}
          body: |
            ## Hystersis ${{ github.ref_name }}

            The autonomous AI coding assistant — powered by OpenRouter. Bring your own model.

            ### One-line install

            ```bash
            # macOS / Linux
            curl -fsSL https://code.hystersis.com/install.sh | sh
            
            # Windows
            powershell -NoProfile -c "irm https://code.hystersis.com/install.ps1 | iex"
            ```

            Then run `hystersis configure` to enter your OpenRouter API key.

            ### Manual download

            | Platform | Binary |
            |----------|--------|
            | macOS Apple Silicon | `hystersis-macos-arm64` |
            | macOS Intel | `hystersis-macos-x64` |
            | Linux x86_64 | `hystersis-linux-x64` |
            | Linux ARM64 | `hystersis-linux-arm64` |
            | Windows x64 | `hystersis-windows-x64.exe` |
            | Windows ARM64 | `hystersis-windows-arm64.exe` |

            Verify with `checksums.txt` (SHA256).
          files: |
            dist/hystersis-macos-arm64
            dist/hystersis-macos-x64
            dist/hystersis-linux-x64
            dist/hystersis-linux-arm64
            dist/hystersis-windows-x64.exe
            dist/hystersis-windows-arm64.exe
            dist/checksums.txt
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

  # ─── Deploy landing page + install.sh to Cloudflare Pages ───────────────
  deploy:
    name: Deploy code.hystersis.com
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: |
          cd landing
          npm install
          npm run build
          cd ..
          mkdir -p site
          cp landing/public/install.sh site/install.sh
          cp -r landing/dist/* site/
          ls -lh site/
          ls -lh site/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy site --project-name=hystersis-code --branch=main --commit-dirty=true
