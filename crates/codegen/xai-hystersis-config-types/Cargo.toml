[package]
license = "Apache-2.0"
name = "xai-hystersis-config-types"
version = "0.1.0"
edition.workspace = true
description = "Leaf configuration value types for the hystersis CLI, extracted from xai-hystersis-shell for dependency inversion."

[dependencies]
agent-client-protocol = { workspace = true }
indexmap = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
strum = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
xai-hystersis-announcements = { workspace = true }
xai-hystersis-config = { workspace = true }
xai-hystersis-mcp = { workspace = true }

[features]
default-bazel = []

[lints]
workspace = true
