[package]
license = "Apache-2.0"
name = "xai-hystersis-http"
version = "0.1.0"
edition.workspace = true
description = "Shared reqwest HTTP clients and User-Agent construction for the hystersis CLI."

[dependencies]
reqwest = { workspace = true, features = ["blocking", "rustls-tls-native-roots"] }
reqwest-middleware = { workspace = true }
# Same 0.23 as reqwest's rustls, so the certificate classifier's downcast resolves.
rustls = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
xai-hystersis-auth = { workspace = true, features = ["middleware"] }
xai-hystersis-extra-ca = { workspace = true }
xai-hystersis-sampler = { path = "../xai-hystersis-sampler" }
xai-hystersis-telemetry = { workspace = true }
xai-hystersis-version = { workspace = true }
xai-hystersis-workspace = { workspace = true }

[dev-dependencies]
rcgen = { workspace = true }

[lints]
workspace = true
