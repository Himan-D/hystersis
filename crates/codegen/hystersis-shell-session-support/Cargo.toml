[package]
license = "MIT"
authors = ["Hystersis AI"]
name = "hystersis-shell-session-support"
version = "0.1.0"
edition.workspace = true
description = "Session-support modules for the hystersis shell crate family: managed MCP gateway catalog/call caching and file-access tracking."

[dependencies]
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "time", "macros"] }
tracing = { workspace = true }
hystersis-file-utils = { path = "../hystersis-file-utils", optional = true }
hystersis-http = { workspace = true }
hystersis-version = { workspace = true }

[features]
default-bazel = []

[dev-dependencies]
axum = { workspace = true }
tokio = { workspace = true, features = ["net", "rt-multi-thread"] }

[lints]
workspace = true
