[package]
license = "MIT"
authors = ["Hystersis AI"]
edition.workspace = true
name = "hystersis-announcements"
version = "0.1.0"
description = "Shared announcement types, persistence, and formatting for Hystersis CLI apps"

[features]
# TS bindings generation only (hystersis-desktop consumes the committed output);
# off by default so Bazel/CI builds never compile ts-rs. See generate.sh.
ts = ["dep:ts-rs"]

[dependencies]
chrono = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
tracing = { workspace = true }
ts-rs = { workspace = true, optional = true }
hystersis-tools = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
