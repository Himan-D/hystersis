[package]
license = "MIT"
authors = ["Hystersis AI"]
name = "hystersis-hooks"
version = "0.1.0"
edition.workspace = true
description = "Runtime hook system for Hystersis — file-based discovery, command execution, and policy enforcement"

[dependencies]
fastrand = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
hystersis-extra-ca = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
shellexpand = "3.1"
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["process", "rt", "macros", "time"] }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
hystersis-config = { workspace = true }
hystersis-tools = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
