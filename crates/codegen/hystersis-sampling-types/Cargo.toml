[package]
license = "MIT"
authors = ["Hystersis AI"]
name = "hystersis-sampling-types"
version = "0.1.0"
edition.workspace = true
description = "Pure data types for the Hystersis sampling / chat-completion API layer"

[dependencies]
async-openai = { workspace = true }
chrono = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
reqwest = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
tracing = { workspace = true }
hystersis-circuit-breaker = { workspace = true }
hystersis-compaction = { path = "../../common/hystersis-compaction" }
hystersis-tools = { path = "../hystersis-tools" }

[dev-dependencies]
assert_matches = { workspace = true }

[lints]
workspace = true
