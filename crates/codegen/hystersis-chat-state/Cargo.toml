[package]
license = "MIT"
authors = ["Hystersis AI"]
name = "hystersis-chat-state"
version = "0.1.0"
edition.workspace = true
description = "Actor-based chat state management for Hystersis agents"

[features]
default-bazel = []

[dependencies]
indexmap = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
strum = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "macros"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
# `CompactionDetail`, embedded in `CompactionMode::Segments`.
hystersis-compaction-transcript = { workspace = true }
hystersis-compaction = { path = "../../common/hystersis-compaction" }
hystersis-sampling-types = { path = "../hystersis-sampling-types" }
hystersis-token-estimation = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
