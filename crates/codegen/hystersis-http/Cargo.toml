[package]
license = "MIT"
authors = ["Hystersis AI"]
name = "hystersis-http"
version = "0.1.0"
edition.workspace = true
description = "Shared reqwest HTTP clients and User-Agent construction for the hystersis CLI."

[dependencies]
reqwest = { workspace = true, features = ["blocking", "rustls-tls-native-roots"] }
reqwest-middleware = { workspace = true }
# Same 0.23 as reqwest's rustls, so the certificate classifier's downcast resolves.
rustls = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
hystersis-auth = { workspace = true, features = ["middleware"] }
hystersis-extra-ca = { workspace = true }
hystersis-sampler = { path = "../hystersis-sampler" }
hystersis-telemetry = { workspace = true }
hystersis-version = { workspace = true }
hystersis-workspace = { workspace = true }

[dev-dependencies]
rcgen = { workspace = true }

[lints]
workspace = true
